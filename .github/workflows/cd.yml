name: CD Frontend - Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: cliniker-frontend
  REPO: cliniker
  IMAGE: web
  DEFAULT_API_URL: https://cliniker-api-769327558062.southamerica-east1.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker image
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-${{ env.DEFAULT_API_URL }}}"
          TAG="${{ github.sha }}"

          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:$TAG \
            .

          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:$TAG

      - name: Deploy to Cloud Run
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_APP_URL: ${{ secrets.NEXT_APP_URL }}
        run: |
          NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-${{ env.DEFAULT_API_URL }}}"
          TAG="${{ github.sha }}"

          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:$TAG \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL,NEXT_APP_URL=$NEXT_APP_URL,NODE_ENV=production"
